name: Build

# 每次推送/PR：编译 Release 并上传构建产物（Actions 页面可下载）
# 推送 v* 标签（如 v1.5.0）：额外打包 zip 并发布 GitHub Release，供程序在线更新
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        id: restore
        run: nuget restore VinXiangQi.sln > restore.log 2>&1; $c=$LASTEXITCODE; Get-Content restore.log; exit $c

      - name: Check tag matches AssemblyVersion
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $m = Select-String -Path VinXiangQi/Properties/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+\.\d+\.\d+)' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "标签 v$tag 与 AssemblyInfo.cs 中的版本 $ver 不一致，请先改版本号再打标签" }

      - name: Build
        id: build
        run: msbuild VinXiangQi.sln /m /p:Configuration=Release /p:Platform="Any CPU" "-flp:logfile=build.log;verbosity=minimal"

      - name: Package
        shell: pwsh
        run: |
          $out = 'VinXiangQi/bin/Release'
          $pkg = 'package'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "$out/*" $pkg -Recurse -Force
          # 不发布调试符号、XML 文档和本地配置
          Get-ChildItem $pkg -Recurse -Include *.pdb,*.xml,settings.json | Remove-Item -Force
          $name = if ('${{ github.ref_type }}' -eq 'tag') { 'VinXiangQi_${{ github.ref_name }}.zip' } else { 'VinXiangQi_build.zip' }
          Compress-Archive -Path "$pkg/*" -DestinationPath $name -Force
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 失败时把日志推到 ci-logs 分支，便于不登录网页也能查看
      - name: Publish failure logs
        if: failure()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force ci_out | Out-Null
          foreach ($l in @('restore.log','build.log')) { if (Test-Path $l) { Copy-Item $l ci_out/ } }
          "run ${{ github.run_id }} sha ${{ github.sha }} restore=${{ steps.restore.outcome }} build=${{ steps.build.outcome }}" | Out-File ci_out/info.txt -Encoding utf8
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          git add -f ci_out
          git commit -m "ci logs ${{ github.run_id }}"
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: VinXiangQi-${{ github.sha }}
          path: package/

      # 发布到本仓库（私有，仅自己可下载备份）
      - name: Release (this repo)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      # 发布到公开的发布仓库，程序在线更新从这里取
      # 需要在仓库 Settings → Secrets 里配置 RELEASE_TOKEN（对发布仓库有 contents 写权限的 PAT），
      # 在 Settings → Variables 里配置 RELEASE_REPO（如 kookoo2024/MyXQ-releases）
      - name: Release (public update repo)
        if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_REPO != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          body: |
            Vin象棋 ${{ github.ref_name }}
